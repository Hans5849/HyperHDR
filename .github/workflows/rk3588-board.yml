# Checks on self-hosted RK3588 boards (issues #18, #12, #11, #8).
#
# Manual dispatch only. Only users with write access can start it, so
# pull-request or fork code never runs on these boards. Do not add
# pull_request or pull_request_target triggers.
#
# Only master can run on the board, through the rk3588-hil environment (add
# required reviewers in Settings -> Environments to gate every run).
#
# Runner (docs/rk3588-board-runner.md, issue #28): repository-scoped, on the
# Orange Pi 5 Plus itself, labels self-hosted, Linux, ARM64, rk3588,
# orange-pi-5-plus, hyperhdr-hil. scripts/rk3588/board-preflight.sh refuses any
# other board, CPU topology, root or passwordless-sudo runner before measuring.
name: RK3588 board checks

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "tests = hardware-free suites + BGR24 benchmark; probe = also run the read-only evidence collector"
        type: choice
        options: [tests, probe]
        default: tests
      expbuf:
        description: "probe stage: also run the EXPBUF probe (opens the receiver; HyperHDR must not be capturing on the board)"
        type: boolean
        default: false
      host_idle_confirmed:
        description: "expbuf with a container runner: you stopped the host's HyperHDR service (the container can't see host processes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rk3588-board-${{ github.ref }}
  cancel-in-progress: false

jobs:
  board:
    name: RK3588 board (${{ inputs.stage }})
    if: github.repository == 'Hans5849/HyperHDR' && github.ref == 'refs/heads/master'
    environment: rk3588-hil
    runs-on: [self-hosted, Linux, ARM64, rk3588, orange-pi-5-plus, hyperhdr-hil]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      # Identity, topology, privileges and exclusivity before anything runs.
      - name: Preflight (board, CPUs, privileges, receiver access)
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
          EXPBUF: ${{ inputs.expbuf }}
          HOST_IDLE: ${{ inputs.host_idle_confirmed }}
        run: |
          mkdir -p board-results
          args=(--env "$GITHUB_ENV" --metadata board-results/metadata.json --inputs "{\"stage\":\"$STAGE\",\"expbuf\":$EXPBUF,\"host_idle_confirmed\":$HOST_IDLE}")
          [ "$STAGE" = probe ] && args+=(--require-receiver)
          [ "$STAGE" = probe ] && [ "$EXPBUF" = true ] && args+=(--exclusive)
          [ "$HOST_IDLE" = true ] && args+=(--host-idle-attested)
          bash scripts/rk3588/board-preflight.sh "${args[@]}" | tee board-results/preflight.txt

      - name: Board and toolchain
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p board-results
          {
            echo "commit: $GITHUB_SHA"
            echo "model: $(tr -d '\0' </proc/device-tree/model 2>/dev/null || echo unknown)"
            uname -a
            grep -E '^(PRETTY_NAME|VERSION)=' /etc/os-release
            [ -r /etc/armbian-release ] && grep -E '^(BOARD|VERSION)=' /etc/armbian-release
            for p in /sys/devices/system/cpu/cpufreq/policy*; do
              echo "$(basename "$p") cpus=$(cat "$p/related_cpus") governor=$(cat "$p/scaling_governor") cur=$(cat "$p/scaling_cur_freq") max=$(cat "$p/scaling_max_freq")"
            done
            for z in /sys/class/thermal/thermal_zone*; do echo "$(cat "$z/type") $(cat "$z/temp") m°C"; done
            cmake --version | head -1; g++ --version | head -1
          } 2>&1 | tee board-results/environment.txt
          missing=""
          for tool in cmake g++ pkg-config; do command -v $tool >/dev/null || missing="$missing $tool"; done
          pkg-config --exists Qt6Core 2>/dev/null || [ -n "$(ls /usr/lib/*/cmake/Qt6Core/Qt6CoreConfig.cmake 2>/dev/null)" ] || missing="$missing qt6-base-dev"
          if [ -n "$missing" ]; then
            echo "::error::Runner is missing:$missing (install build-essential cmake pkg-config qt6-base-dev libturbojpeg0-dev)"
            exit 1
          fi

      - name: V4L2 capture tests (ASan/UBSan, native ARM64)
        run: |
          cmake -S tests/v4l2 -B build-v4l2 -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-v4l2 -j
          ctest --test-dir build-v4l2 --output-on-failure

      - name: Command-line parser tests (ASan/UBSan, native ARM64)
        run: |
          cmake -S tests/cli -B build-cli -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-cli -j
          ctest --test-dir build-cli --output-on-failure

      - name: BGR24 decoder check (ASan/UBSan) and evidence-collector test
        run: |
          cmake -S tests/codec_test -B build-codec-asan -DPLATFORM=linux -DCMAKE_BUILD_TYPE=Release -DUSE_CCACHE_CACHING=OFF -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-codec-asan -j --target DecoderTest
          ctest --test-dir build-codec-asan --output-on-failure
          bash tests/rk3588/collect-evidence-test.sh
          bash tests/diagnostics/doctor-test.sh
          bash tests/rk3588/board-preflight-test.sh

      # Release build without sanitizers, pinned to one core per cluster. The
      # preflight found which CPUs are Cortex-A76 and Cortex-A55 and which of them
      # this runner's container may use.
      #
      # DecoderTest is written to ${PROJECT_BINARY_DIR}/bin (EXECUTABLE_OUTPUT_PATH
      # in tests/codec_test/CMakeLists.txt), so the binary is build-codec/bin/DecoderTest.
      # tests/ci/board-workflow-policy-test.py checks this path against that CMake
      # file. The first board run failed with exit 127 on ./build-codec/DecoderTest.
      #
      # Each result is written to a file, not piped through tee, so a failing
      # benchmark fails the step. Both cores are always attempted so one failure
      # doesn't hide the other result.
      - name: BGR24 decode benchmark (#12)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          : "${A76_CPU:?the preflight did not export A76_CPU}"
          : "${A55_CPU:?the preflight did not export A55_CPU}"
          mkdir -p board-results
          BUILD=build-codec
          BENCH="$BUILD/bin/DecoderTest"
          FLAGS="-DPLATFORM=linux -DCMAKE_BUILD_TYPE=Release -DUSE_CCACHE_CACHING=OFF"
          echo "codec_test: cmake $FLAGS" >board-results/cmake-flags.txt
          cmake -S tests/codec_test -B "$BUILD" $FLAGS
          cmake --build "$BUILD" -j --target DecoderTest
          if [ ! -f "$BENCH" ] || [ ! -x "$BENCH" ]; then
            echo "::error::Benchmark executable $BENCH is missing or not executable. DecoderTest files under $BUILD: $(find "$BUILD" -name DecoderTest -type f | tr '\n' ' ')"
            exit 1
          fi
          { grep -E '^(CMAKE_BUILD_TYPE|CMAKE_CXX_FLAGS|CMAKE_CXX_COMPILER|PLATFORM|USE_CCACHE_CACHING):' "$BUILD/CMakeCache.txt" || true; } >>board-results/cmake-flags.txt
          echo "benchmark executable: $BENCH" >>board-results/cmake-flags.txt

          cpu_state() {   # governor, frequency and thermal readings; tolerant of missing sysfs
            local cpu=$1 d=/sys/devices/system/cpu/cpu$1/cpufreq z
            echo "cpu$cpu governor=$(cat "$d/scaling_governor" 2>/dev/null || echo n/a) cur=$(cat "$d/scaling_cur_freq" 2>/dev/null || echo n/a) kHz max=$(cat "$d/scaling_max_freq" 2>/dev/null || echo n/a) kHz"
            for z in /sys/class/thermal/thermal_zone*; do echo "thermal $(cat "$z/type" 2>/dev/null || echo ?) $(cat "$z/temp" 2>/dev/null || echo n/a) m°C"; done
          }

          failed=0
          for entry in "A76:$A76_CPU" "A55:$A55_CPU"; do
            name=${entry%%:*}; cpu=${entry#*:}
            out="board-results/bgr24-bench-$(echo "$name" | tr A-Z a-z).txt"
            {
              echo "== $name, CPU $cpu"
              echo "commit: $GITHUB_SHA"
              echo "synthetic input: 1920x1080 BGR24, stride 5760, generated in memory; not the HDMI receiver's current signal (see receiver-signal.txt)"
              echo "decoder time only, not HDMI-to-LED latency"
              echo "contention: this board is shared with other runners and services; load average $(cat /proc/loadavg 2>/dev/null || echo n/a); allowed CPUs $(taskset -cp $$ 2>/dev/null || echo n/a)"
              echo "-- before"
              cpu_state "$cpu"
              echo "-- benchmark"
            } >"$out" 2>&1
            if awk '{exit !($1 > 1.0)}' /proc/loadavg 2>/dev/null; then
              echo "::warning::$name: 1-minute load average is above 1.0; treat these numbers as indicative, not a baseline"
              echo "WARNING: load average above 1.0 before the run; not a baseline" >>"$out"
            fi
            status=0
            taskset -c "$cpu" "$BENCH" --bgr24-bench >>"$out" 2>&1 || status=$?
            { echo "-- after"; cpu_state "$cpu"; echo "exit status: $status"; } >>"$out" 2>&1
            cat "$out"
            if [ "$status" -ne 0 ]; then
              echo "::error::$name benchmark on CPU $cpu failed with exit status $status"
              failed=1
            fi
          done
          exit "$failed"

      - name: Installation and diagnostics checks on the board (#27)
        if: inputs.stage == 'probe'
        shell: bash
        run: |
          bash scripts/diagnostics/hyperhdr-doctor.sh --archive board-results --no-color | tee board-results/doctor.txt || true

      - name: Read-only evidence collector (#8, #10, #13)
        if: inputs.stage == 'probe'
        shell: bash
        env:
          EXPBUF: ${{ inputs.expbuf }}
        run: |
          ls /dev/video* >/dev/null 2>&1 || echo "::warning::No /dev/video* visible to the runner; pass the devices into its container"
          args=(--out board-results)
          [ "$EXPBUF" = "true" ] && args+=(--expbuf)
          bash scripts/rk3588/collect-evidence.sh "${args[@]}" | tee board-results/evidence-summary.txt
          # Source timing (what the HDMI source sends, queried) and the configured
          # capture format are different things; keep them apart.
          {
            echo "Not interchangeable: the source can send 3840x2160@30 while capture is configured for 1920x1080."
            sed -n 's/^dv timings: */source timing (VIDIOC_QUERY_DV_TIMINGS): /p; s/^format: */configured capture format (VIDIOC_G_FMT): /p; s/^quantization: */configured quantization: /p; s/^receiver: */receiver node (discovered by driver, never assumed): /p' board-results/evidence-summary.txt
          } >board-results/receiver-signal.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rk3588-board-${{ inputs.stage }}-${{ github.run_number }}
          path: board-results/
          retention-days: 30

      # Keep the board's storage bounded: build trees are recreated every run.
      - name: Clean build trees
        if: always()
        run: rm -rf build-v4l2 build-cli build-codec build-codec-asan board-results
