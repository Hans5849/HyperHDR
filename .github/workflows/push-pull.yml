name: HyperHDR CI Build

on:
  push:
  pull_request:  

env:
    USE_CACHE: ${{ fromJSON(vars.USE_CACHE || 'false') }}
    RESET_CACHE: ${{ fromJSON(vars.RESET_CACHE || 'false') }}
    BUILD_ARCHIVES: ${{ startsWith(github.event.ref, 'refs/tags') && true || false }}

jobs:

######################
## Capture tests #####
######################

  CaptureTests:
    name: V4L2 capture and BGR24 decoder tests (ASan/UBSan, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          # Same suites natively on ARM64, the RK3588 target architecture.
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ qt6-base-dev libturbojpeg0-dev python3 python3-yaml

      - name: V4L2 capture tests (no hardware, injected syscalls)
        run: |
          cmake -S tests/v4l2 -B build-v4l2 -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-v4l2 -j
          ctest --test-dir build-v4l2 --output-on-failure

      - name: BGR24 reference tests (independent expected values, no Qt)
        run: |
          cmake -S tests/bgr24 -B build-bgr24 -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-bgr24 -j
          ctest --test-dir build-bgr24 --output-on-failure

      - name: Colour-quality references (Qt-free framework, CPU row backend, negative controls)
        run: |
          cmake -S tests/color_reference -B build-color-reference -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-color-reference -j
          ctest --test-dir build-color-reference --output-on-failure

      - name: BGR24 decoder regression (real FrameDecoder dispatch)
        run: |
          cmake -S tests/codec_test -B build-codec -DPLATFORM=linux -DCMAKE_BUILD_TYPE=Release -DUSE_CCACHE_CACHING=OFF -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-codec -j --target DecoderTest
          ctest --test-dir build-codec --output-on-failure

      - name: BGR24 benchmark reporting (statistics, metadata, JSON/CSV, summarizer)
        run: |
          cmake -S tests/bench_report -B build-bench-report -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-bench-report -j
          ctest --test-dir build-bench-report --output-on-failure
          build-bench-report/bench-report-test --emit-sample build-bench-report/sample
          python3 tests/ci/bench-summarize-test.py build-bench-report/sample
          # The real DecoderTest (built in the previous step): default output keeps
          # the original header, and its JSON passes the summarizer's raw-sample check.
          build-codec/bin/DecoderTest --bgr24-bench --iterations 2 --warmup 1 >build-bench-report/default.txt
          head -1 build-bench-report/default.txt | grep -qx 'BGR24 decode 1920x1080 stride 5760: 2 timed runs per case after 1 warm-up (ms)'
          sed -n 2p build-bench-report/default.txt | grep -q '^range    output   lut      median        p95        min$'
          if grep -q 'input pattern' build-bench-report/default.txt; then echo '::error::default output changed'; exit 1; fi
          build-codec/bin/DecoderTest --bgr24-bench --iterations 3 --warmup 1 --pattern random,solid --raw \
            --json build-bench-report/decoder.json --csv build-bench-report/decoder.csv --commit "$GITHUB_SHA" --label hosted
          python3 scripts/rk3588/bench-summarize.py build-bench-report/decoder.json
          test "$(wc -l <build-bench-report/decoder.csv)" -eq 17
          if build-codec/bin/DecoderTest --bgr24-bench --jsn x; then echo '::error::unknown benchmark option accepted'; exit 1; fi
          # JSON specification: field names, types, units, null vs zero, counts,
          # recomputed statistics and ordering, on the C++ sample and the real output.
          python3 tests/ci/bench-validate-test.py build-bench-report/sample
          python3 scripts/rk3588/bench-validate.py --iterations 3 --warmup 1 --patterns random,solid --raw build-bench-report/decoder.json
          # Saved raw-frame input (synthetic fixtures; no capture device is opened).
          python3 tests/bench_report/fixtures/make-fixtures.py --check
          for f in scene-64x36-padded scene-64x36-tight; do
            build-codec/bin/DecoderTest --bgr24-bench --iterations 3 --warmup 1 --raw \
              --input tests/bench_report/fixtures/$f.bgr24 --input-desc tests/bench_report/fixtures/$f.desc \
              --json build-bench-report/$f.json --commit "$GITHUB_SHA" --label hosted >build-bench-report/$f.txt
            grep -q "^input file: $f.bgr24 sha256 " build-bench-report/$f.txt
            python3 scripts/rk3588/bench-validate.py --iterations 3 --warmup 1 --raw \
              --input-sha256 "$(sha256sum tests/bench_report/fixtures/$f.bgr24 | cut -d' ' -f1)" build-bench-report/$f.json
          done
          python3 scripts/rk3588/bench-summarize.py build-bench-report/scene-64x36-padded.json build-bench-report/scene-64x36-tight.json
          # Rejected inputs exit 2 without timing anything.
          head -c 6000 tests/bench_report/fixtures/scene-64x36-tight.bgr24 >build-bench-report/short.bgr24
          set +e
          build-codec/bin/DecoderTest --bgr24-bench --input build-bench-report/short.bgr24 --input-desc tests/bench_report/fixtures/scene-64x36-tight.desc 2>build-bench-report/short.err
          status=$?
          build-codec/bin/DecoderTest --bgr24-bench --input tests/bench_report/fixtures/scene-64x36-tight.bgr24 --input-desc tests/bench_report/fixtures/scene-64x36-tight.desc --pattern solid 2>build-bench-report/both.err
          both=$?
          set -e
          test "$status" -eq 2 && grep -q "short file" build-bench-report/short.err
          test "$both" -eq 2 && grep -q -- "--input replaces --pattern" build-bench-report/both.err

      - name: LED output counters and DDP packetization (no device, no network)
        run: |
          cmake -S tests/led_output -B build-led-output -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-led-output -j
          ctest --test-dir build-led-output --output-on-failure

      - name: Command-line parser tests (no Qt option warnings)
        run: |
          cmake -S tests/cli -B build-cli -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-cli -j
          ctest --test-dir build-cli --output-on-failure

      - name: Colour reference patterns (generator, manifests, preview checker)
        run: python3 tests/ci/color-patterns-test.py

      - name: Optical latency analysis (synthetic recordings with known delays)
        run: python3 tests/ci/optical-latency-test.py

      - name: Debian version mapping
        run: cmake -P tests/packaging/debian-version-test.cmake

      - name: Board artifact verification (fixtures built around the C++ writer's sample runs)
        run: python3 tests/ci/verify-board-artifact-test.py build-bench-report/sample

      - name: Capture and LED statistics alignment (real formatter output, no board)
        run: python3 tests/ci/stats-align-test.py

      - name: RK3588 evidence collector (stub board, redaction, read-only)
        run: bash tests/rk3588/collect-evidence-test.sh

      - name: Installation and diagnostics checks (stubbed systems, read-only)
        run: bash tests/diagnostics/doctor-test.sh

      - name: Header hygiene (no precompiled header, double include)
        run: bash tests/ci/header-hygiene-test.sh

      - name: Board runner preflight and workflow trust policy
        run: |
          bash tests/rk3588/board-preflight-test.sh
          python3 tests/ci/board-workflow-policy-test.py
          python3 tests/ci/cache-cleaner-policy-test.py

######################
###### Linux #########
######################

  Linux:
    name: ${{ matrix.architecture }}/${{ matrix.distroName}}:${{ matrix.distroVersion }}
    runs-on: ${{ startsWith(matrix.architecture, 'arm') && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
    env:
      platform: ${{ startsWith(matrix.architecture, 'arm') && 'rpi' || 'linux' }}
    strategy:      
      matrix:
        distroName: [debian]
        distroVersion: [bullseye, bookworm, trixie, forky]
        architecture: [amd64, armhf, arm64]        
        include:
          - distroName: ubuntu
            distroVersion: noble
            architecture: amd64
          - distroName: ubuntu
            distroVersion: resolute
            architecture: amd64
          - distroName: fedora
            distroVersion: 44
            architecture: amd64
          - distroName: archlinux
            distroVersion: latest
            architecture: amd64

    steps:   
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Download ccache files
        if: env.USE_CACHE == 'true'
        uses: actions/cache@v6.1.0
        with:
           path: .ccache
           key: ${{ matrix.architecture }}-${{ matrix.distroName }}-${{ matrix.distroVersion }}-ccache-${{ github.run_id }}
           restore-keys: ${{ matrix.architecture }}-${{ matrix.distroName }}-${{ matrix.distroVersion }}-ccache-

      - name: Check default version
        if: matrix.distroVersion != 'bullseye'
        run: |
          echo "USE_STANDARD_INSTALLER_NAME=true" >> $GITHUB_ENV

      - name: Build packages
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          DISTRO_NAME: ${{ matrix.distroName }}
          DISTRO_VERSION: ${{ matrix.distroVersion }}
          PLATFORM: ${{ env.platform }}
          USE_CCACHE: ${{ env.USE_CACHE }}
          RESET_CACHE: ${{ env.RESET_CACHE }}
        shell: bash
        run: |
          ./build.sh

      - name: Check Debian package metadata
        if: matrix.distroName == 'debian' || matrix.distroName == 'ubuntu'
        shell: bash
        run: |
          DEB=$(find deploy -maxdepth 1 -type f -name "Hyper*.deb" | head -n 1)
          test -n "$DEB" || { echo "no .deb produced"; exit 1; }
          bash tests/packaging/check-deb.sh "$DEB" --version-file version --arch ${{ matrix.architecture }}

      - name: Install package and run command-line checks
        if: matrix.distroName == 'debian' && matrix.distroVersion == 'trixie' && (matrix.architecture == 'amd64' || matrix.architecture == 'arm64')
        shell: bash
        run: |
          docker run --rm -v "$PWD:/w:ro" --entrypoint /bin/bash \
            ghcr.io/awawa-dev/${{ matrix.architecture }}/debian:trixie -c '
              set -e
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /w/deploy/Hyper*.deb
              hyperhdr --version | tee /tmp/version.txt
              grep -F "$(head -n1 /w/version)" /tmp/version.txt
              bash /w/tests/cli/hyperhdr-cli-smoke.sh --daemon /usr/bin/hyperhdr
            '

      - name: Clear branch ccache storage
        if: startsWith(github.event.ref, 'refs/tags') == false
        continue-on-error: true
        run: |
          gh cache list --ref "${{ github.ref }}" --key "${{ matrix.architecture }}-${{ matrix.distroName }}-${{ matrix.distroVersion }}-ccache-" --limit 100 --json id --jq '.[].id' | xargs -r -n1 gh cache delete
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifacts (release)
        if: startsWith(github.event.ref, 'refs/tags') && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-artifact-${{ matrix.architecture }}-${{ matrix.distroName }}-${{ matrix.distroVersion }}
          path: deploy/Hyper*

      - name: Find artifact file
        id: find_artifact
        if: startsWith(github.event.ref, 'refs/tags') == false
        run: |
          ARTIFACT_FILE=$(find deploy -maxdepth 1 -type f \( -name "Hyper*.deb" -o -name "Hyper*.zst" -o -name "Hyper*.rpm" \) | head -n 1)
          echo "installer_artifact_path=$ARTIFACT_FILE" >> $GITHUB_OUTPUT

      - name: Upload artifacts from commit
        if: startsWith(github.event.ref, 'refs/tags') == false && steps.find_artifact.outputs.installer_artifact_path != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ steps.find_artifact.outputs.installer_artifact_path }}
          archive: false

######################
######## macOS #######
######################

  macOS:
    name: ${{ matrix.JOB_NAME }}
    runs-on: ${{ matrix.JOB_RUNNER }}
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      matrix:
        include:        
          - JOB_RUNNER: macos-15
            JOB_NAME: "macOS 15 (arm64: M1/M2/M3/M4)"
            NICE_NAME: arm64
          - JOB_RUNNER: macos-15-intel
            JOB_NAME: macOS 15 (x64)
            NICE_NAME: x64
    steps:
      # Checkout
      - uses: actions/checkout@v7.0.1
        with:
            submodules: true

      - name: Download ccache files
        if: env.USE_CACHE == 'true'
        uses: actions/cache@v6.1.0
        with:
            path: build/.ccache
            key: macOS-${{ matrix.NICE_NAME }}-ccache-${{ github.run_id }}
            restore-keys: macOS-${{ matrix.NICE_NAME }}-ccache

      # Install deps
      - name: Install deps
        shell: bash
        run: brew install -q qtbase qtserialport ccache zstd webp jpeg-turbo flatbuffers pkg-config || true
            
      - name: Build packages
        env:
            PLATFORM: osx
            USE_CCACHE: ${{ env.USE_CACHE }}
            RESET_CACHE: ${{ env.RESET_CACHE }}
            JOB_RUNNER: ${{ matrix.JOB_RUNNER }}
        shell: bash
        run: ./build.sh || ./build.sh

      - name: Clear branch ccache storage
        continue-on-error: true
        run: |
          gh cache list --ref "${{ github.ref }}" --key "macOS-${{ matrix.NICE_NAME }}-ccache" --limit 100 --json id --jq '.[].id' | xargs -r -n1 gh cache delete
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifacts (release)
        if: startsWith(github.event.ref, 'refs/tags') && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
            name: release-artifact-${{ matrix.JOB_RUNNER }}      
            path: build/Hyper*.dmg

      - name: Find artifact file
        id: find_artifact
        if: startsWith(github.event.ref, 'refs/tags') == false
        run: |
          ARTIFACT_FILE=$(ls -S build/Hyper*.dmg 2>/dev/null | head -n 1)
          echo "installer_artifact_path=$ARTIFACT_FILE" >> $GITHUB_OUTPUT

      - name: Upload artifacts from commit
        if: startsWith(github.event.ref, 'refs/tags') == false && steps.find_artifact.outputs.installer_artifact_path != ''
        uses: actions/upload-artifact@v7.0.2
        with:
            path: ${{ steps.find_artifact.outputs.installer_artifact_path }}
            archive: false

######################
###### Windows #######
######################

  windows:
    name: Windows
    runs-on: ${{ matrix.os }}
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      matrix:
        os: [windows-2022]
    env:
      MSVC: 2022
      QT_VERSION: 6.8.3
      TOOLKIT_DIR: "${{ github.workspace }}\\Toolkit"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Cache Toolkit
        uses: actions/cache@v6.1.0
        id: cache-toolkit-windows
        with:
          path: ${{ env.TOOLKIT_DIR }}
          key: ${{ matrix.os }}-Toolkit-Qt.${{ env.QT_VERSION }}-NSIS-TurboJPEG

      - name: Python 3.13 for aqtinstall
        if: steps.cache-toolkit-windows.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7      
        with:
          python-version: '3.13'

      - name: "Install Toolkit: Qt, TurboJPEG and NSIS"
        if: steps.cache-toolkit-windows.outputs.cache-hit != 'true'
        shell: powershell
        run: |          
          Invoke-WebRequest -Method Get -Uri https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.0.3/libjpeg-turbo-3.0.3-vc64.exe -OutFile turbojpeg.exe -UseBasicParsing
          Start-Process -Wait turbojpeg.exe -ArgumentList "/S","/D=$env:TOOLKIT_DIR\libjpeg-turbo64"
          Invoke-WebRequest -UserAgent "Wget" -Uri "https://prdownloads.sourceforge.net/nsis/nsis-3.11-setup.exe" -OutFile nsis.exe
          Start-Process -Wait nsis.exe -ArgumentList "/S","/D=$env:TOOLKIT_DIR\nsis"
          New-Item -ItemType Directory -Force -Path "$env:TOOLKIT_DIR\ccache" | Out-Null
          Invoke-WebRequest -Method Get -Uri https://github.com/ccache/ccache/releases/download/v4.14/ccache-4.14-windows-x86_64.zip -OutFile "$env:TOOLKIT_DIR\ccache\ccache.zip" -UseBasicParsing
          pip install aqtinstall
          aqt install-qt -O "$env:TOOLKIT_DIR\Qt" windows desktop $env:QT_VERSION "win64_msvc${env:MSVC}_64" -m qtserialport

      - name: "Restore Toolkit"
        shell: cmd
        run: |
          7z e "%TOOLKIT_DIR%\ccache\ccache.zip" -o.\build *.exe -r
          echo %TOOLKIT_DIR%\nsis>> %GITHUB_PATH%

      - name: Download ccache files
        if: env.USE_CACHE == 'true'
        uses: actions/cache@v6.1.0
        with:
            path: build/.ccache
            key: ${{ runner.os }}-ccache-${{ github.run_id }}
            restore-keys: ${{ runner.os }}-ccache
          
      - name: Build packages        
        env:
          PLATFORM: windows
          VCINSTALLDIR: 'C:/Program Files/Microsoft Visual Studio/${{ env.MSVC }}/Enterprise/VC'
          CMAKE_PREFIX_PATH: "${{ env.TOOLKIT_DIR }}\\Qt\\${{ env.QT_VERSION }}\\msvc${{ env.MSVC }}_64\\lib\\cmake\\"
          USE_CCACHE: ${{ env.USE_CACHE }}
        shell: bash
        run: |
          "${{env.VCINSTALLDIR}}/Auxiliary/Build/vcvars64.bat"
          ./build.sh

      - name: Clear branch ccache storage
        continue-on-error: true
        run: |
          gh cache list --ref "${{ github.ref }}" --key "${{ runner.os }}-ccache" --limit 100 --json id --jq '.[].id' | xargs -r -n1 gh cache delete
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload unsigned artifacts
        if:  github.event_name != 'pull_request' && fromJSON(vars.USE_SIGNPATH || 'false')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unsigned-windows-installer
          path: build/Hyper*.exe
          retention-days: 1

      - name: Find artifact file
        id: find_artifact
        if: startsWith(github.event.ref, 'refs/tags') == false && fromJSON(vars.USE_SIGNPATH || 'false') == false
        shell: bash
        run: |
          ARTIFACT_FILE=$(ls -S build/Hyper*.exe 2>/dev/null | head -n 1)
          echo "installer_artifact_path=$ARTIFACT_FILE" >> $GITHUB_OUTPUT

      - name: Upload artifacts from commit
        if: startsWith(github.event.ref, 'refs/tags') == false && steps.find_artifact.outputs.installer_artifact_path != ''
        uses: actions/upload-artifact@v7.0.2
        with:
            path: ${{ steps.find_artifact.outputs.installer_artifact_path }}
            archive: false          

################################
###### Sign Windows ############
################################

  sign-windows:
    name: Sign Windows Installer
    needs: [windows]
    runs-on: ubuntu-26.04
    if:  github.event_name != 'pull_request' && fromJSON(vars.USE_SIGNPATH || 'false')
    steps:
      - name: Download unsigned artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: unsigned-windows-installer
          path: to_sign

      - name: Check SignPath Secrets
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [ -z "$SIGNPATH_TOKEN" ] || [ -z "$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "SignPath secrets not found."
            exit 1
          fi

      - name: Upload unsigned ZIP to GitHub (SignPath V2 requirement)
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: signpath_upload
          path: to_sign/
          retention-days: 1

      - name: Sign artifact with SignPath
        id: signpath_step
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'hyperhdr'
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/') && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed_artifact

      - name: Check SignPath result & fail if needed
        if: always()
        run: |
          if [ "${{ steps.signpath_step.outcome }}" != "success" ]; then
            echo "::error::SignPath action failed technically (check logs for timeout/network issues)."
            exit 1
          fi
          
          if [ ! -d "signed_artifact" ] || [ -z "$(ls -A signed_artifact 2>/dev/null)" ]; then
            echo "::error::SignPath reported success, but NO signed artifacts were downloaded!"
            echo "This usually means the signing request was REJECTED or failed silently."
            exit 1
          fi          
          echo "Signing successful. Artifacts found in 'signed_artifact'."
          
      - name: Upload artifacts (release)
        if: startsWith(github.event.ref, 'refs/tags')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-artifact-windows
          path: signed_artifact/Hyper*.exe
          
      - name: Upload artifacts from commit
        if: startsWith(github.event.ref, 'refs/tags') == false
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Windows_x64_setup_signed
          path: signed_artifact/Hyper*.exe

################################
####### CodeQL support #########
################################

  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-26.04
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) && fromJSON(vars.USE_CODEQL || 'true')

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp', 'javascript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Run composite CodeQL job for '${{matrix.language}}' language
        uses: ./.github/actions/codeql
        with:
          language: ${{matrix.language}}

#########################################
####### Static C++20/QT analyze #########
#########################################

  clang-tidy-clazy:
    name: Analyze (clang and clazy)
    runs-on: ubuntu-26.04
    if: fromJSON(vars.USE_CODEQL || 'false') && false

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc jq clang clang-tidy clang-tools clazy build-essential cmake flatbuffers-compiler git libasound2-dev libayatana-appindicator3-dev libegl-dev libflatbuffers-dev libftdi1-dev libgl-dev libglvnd-dev libgtk-3-dev liblzma-dev libpipewire-0.3-dev libssl-dev libsystemd-dev libturbojpeg0-dev libusb-1.0-0-dev libx11-dev libzstd-dev ninja-build patchelf pkg-config python3 qt6-serialport-dev qt6-base-dev unzip wget

      - name: Configure (CMake with Makefiles)
        run: |
          cmake -S . -B build \
            -DUSE_PRECOMPILED_HEADERS=OFF \
            -DUSE_CCACHE_CACHING=OFF \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build project
        run: cmake --build build --parallel $(nproc)

      - name: Run clazy
        run: |
          jq -r '.[] | .file' build/compile_commands.json | tr '\n' '\0' | xargs -0 clazy-standalone -p build -ignore-dirs "/external/|_deps/" 2>&1 | sed "/warning: argument unused during compilation: '-fuse-ld=gold'/d; /\[-Wclazy-const-signal-or-slot\]/,/^[[:space:]]*\^/d; /\[-Wclazy-qstring-arg\]/,/^[[:space:]]*\^/d; /\[-Wclazy-skipped-base-method\]/,/^[[:space:]]*\^/d" | sed '/^In file included from/d; /^[0-9]\+ warning.* generated\./d' > clazy-report.txt || true

      - name: Run clang-tidy
        run: |
          jq -r '.[] | select(.file | test("external/|_deps/|/mocs_") | not) | .file' build/compile_commands.json | xargs run-clang-tidy -p build -quiet | awk 'BEGIN{b=""}/: warning:/{if(b!=""&&!s)printf"%s",b;b="";s=0;c=$0~/(pass-by-value|value-param)/;l="";nx=0}{b=b$0"\n";if(c){if(nx){if(substr($0,idx)~/^Q[A-Z][a-zA-Z0-9]*/)s=1;nx=0}if($0~/^[ \t]*\|?[ \t]*\^/){idx=index($0,"^");if(substr(l,idx)~/^(const[ \t]+)?Q[A-Z][a-zA-Z0-9]*/)s=1;nx=1}if($0~/^[ \t]*[0-9]+ \|/)l=$0}}END{if(b!=""&&!s)printf"%s",b}' > clang-tidy-report.txt || true
#          jq -r '.[] | select(.file | test("external/|_deps/|autogen|mocs_|qrc_") | not) | .file' build/compile_commands.json | xargs run-clang-tidy -p build -quiet -config="$(cat .clang-tidy-fix)" -fix > clang-tidy-fix.log 2>&1 || true
      - name: Combine reports
        run: |
          echo "### Clang-Tidy Report" > report.md
          echo "\`\`\`" >> report.md
          cat clang-tidy-report.txt >> report.md
          echo "\`\`\`" >> report.md
          echo "" >> report.md
          echo "### Clazy Report" >> report.md
          echo "\`\`\`" >> report.md
          cat clazy-report.txt >> report.md
          echo "\`\`\`" >> report.md

      - name: Convert report to HTML
        run: |
          pandoc report.md -f markdown -t html -s -o cpp_report.html

      - name: Upload report artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: static-cpp-analysis-report
          path: |
            cpp_report.html
            clang-tidy-report.txt
            clazy-report.txt

################################
###### Publish Releases ########
################################

  publish:
    name: Publish Releases
    if: startsWith(github.event.ref, 'refs/tags') && github.event_name != 'pull_request'
    # Capture/decoder/CLI suites are a release gate, not only a build signal.
    needs: [CaptureTests, Linux, sign-windows, macOS]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Generate environment variables from version and tag
        run: |
          echo "TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
          echo "VERSION=$(tr -d '\n' < version)" >> $GITHUB_ENV
          echo "preRelease=false" >> $GITHUB_ENV

      - name: Mark release as pre-release
        if: contains(env.VERSION, 'alpha') || contains(env.VERSION, 'beta')
        run: echo "preRelease=true" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          pattern: release-artifact-*
          merge-multiple: true          

      - name: Create draft release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: HyperHDR ${{ env.VERSION }}
          tag_name: ${{ env.TAG }}
          files: "artifacts/**"
          draft: true
          prerelease: ${{ env.preRelease }}
