# TEMPORARY (branch ci/vector-bench only, never merged): synthetic
# microbenchmark of the VECTOR_* row decoders, master vs PR #64, on
# GitHub-hosted x86_64 and ARM64. Not an RK3588 measurement.
name: Vectorised decoder microbenchmark (temporary)
on:
  push:
    branches: [ci/vector-bench]
permissions:
  contents: read
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Microbenchmark (master header vs this branch)
        run: bash ci-bench/run.sh | tee -a "$GITHUB_STEP_SUMMARY"
